  <path class="line" d="M700 715 L1050 527"/>
  <path class="line" d="M700 715 L1050 617"/>

  <text class="small" x="1030" y="230">read/write</text>
  <text class="small" x="1030" y="795">Reports combine users, events, participants and attendance records.</text>
</svg>
