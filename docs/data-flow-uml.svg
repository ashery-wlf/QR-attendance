<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
  <title id="title">QR Attendance System UML Data Flow Structure</title>
  <desc id="desc">UML activity-style data flow diagram showing attendee registration, event creation, event participation, QR attendance scanning, validation, database storage, and report generation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .lane-title { fill: #0f172a; font: 700 18px Arial, sans-serif; }
      .node { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .db { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .error { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; rx: 8; }
      .decision { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .text { fill: #111827; font: 14px Arial, sans-serif; text-anchor: middle; }
      .small { fill: #334155; font: 12px Arial, sans-serif; text-anchor: middle; }
      .line { fill: none; stroke: #263238; stroke-width: 2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .startend { fill: #111827; stroke: #111827; stroke-width: 2; }
      .end-ring { fill: #ffffff; stroke: #111827; stroke-width: 3; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="930"/>
  <text x="600" y="38" class="lane-title" text-anchor="middle">QR Attendance System - UML Data Flow Structure</text>

  <rect class="lane" x="40" y="70" width="260" height="810"/>
  <rect class="lane" x="320" y="70" width="260" height="810"/>
  <rect class="lane" x="600" y="70" width="260" height="810"/>
  <rect class="lane" x="880" y="70" width="280" height="810"/>

  <text x="170" y="105" class="lane-title" text-anchor="middle">Attendee</text>
  <text x="450" y="105" class="lane-title" text-anchor="middle">System</text>
  <text x="730" y="105" class="lane-title" text-anchor="middle">Database</text>
  <text x="1020" y="105" class="lane-title" text-anchor="middle">Organizer</text>

  <circle class="startend" cx="170" cy="140" r="12"/>

  <rect class="node" x="70" y="175" width="200" height="58"/>
  <text x="170" y="199" class="text">Enter personal</text>
  <text x="170" y="217" class="text">registration details</text>

  <rect class="node" x="350" y="175" width="200" height="58"/>
  <text x="450" y="199" class="text">Validate and store</text>
  <text x="450" y="217" class="text">attendee data</text>

  <path class="db" d="M650 178 C650 165 810 165 810 178 L810 224 C810 237 650 237 650 224 Z"/>
  <path class="db" d="M650 178 C650 191 810 191 810 178"/>
  <text x="730" y="208" class="text">users table</text>

  <rect class="node" x="920" y="265" width="200" height="58"/>
  <text x="1020" y="289" class="text">Enter event</text>
  <text x="1020" y="307" class="text">details</text>

  <rect class="node" x="350" y="265" width="200" height="58"/>
  <text x="450" y="289" class="text">Validate and store</text>
  <text x="450" y="307" class="text">event data</text>

  <path class="db" d="M650 268 C650 255 810 255 810 268 L810 314 C810 327 650 327 650 314 Z"/>
  <path class="db" d="M650 268 C650 281 810 281 810 268"/>
  <text x="730" y="298" class="text">events table</text>

  <rect class="node" x="70" y="355" width="200" height="58"/>
  <text x="170" y="379" class="text">Join selected</text>
  <text x="170" y="397" class="text">event</text>

  <rect class="node" x="350" y="355" width="200" height="58"/>
  <text x="450" y="379" class="text">Record attendee-event</text>
  <text x="450" y="397" class="text">relationship</text>

  <path class="db" d="M650 358 C650 345 810 345 810 358 L810 404 C810 417 650 417 650 404 Z"/>
  <path class="db" d="M650 358 C650 371 810 371 810 358"/>
  <text x="730" y="388" class="text">participants table</text>

  <rect class="node" x="70" y="455" width="200" height="76"/>
  <text x="170" y="481" class="text">Scan QR code</text>
  <text x="170" y="499" class="text">Send QR, device</text>
  <text x="170" y="517" class="text">and location data</text>

  <rect class="node" x="350" y="455" width="200" height="76"/>
  <text x="450" y="481" class="text">Validate QR,</text>
  <text x="450" y="499" class="text">participant, device</text>
  <text x="450" y="517" class="text">and location data</text>

  <polygon class="decision" points="450,570 535,625 450,680 365,625"/>
  <text x="450" y="619" class="text">Attendance</text>
  <text x="450" y="637" class="text">valid?</text>

  <path class="db" d="M650 602 C650 589 810 589 810 602 L810 648 C810 661 650 661 650 648 Z"/>
  <path class="db" d="M650 602 C650 615 810 615 810 602"/>
  <text x="730" y="632" class="text">attendance table</text>

  <rect class="error" x="350" y="720" width="200" height="58"/>
  <text x="450" y="744" class="text">Reject attendance</text>
  <text x="450" y="762" class="text">and show error</text>

  <rect class="node" x="920" y="720" width="200" height="58"/>
  <text x="1020" y="744" class="text">Request and view</text>
  <text x="1020" y="762" class="text">attendance report</text>

  <rect class="node" x="350" y="810" width="200" height="58"/>
  <text x="450" y="834" class="text">Generate report from</text>
  <text x="450" y="852" class="text">system records</text>

  <circle class="end-ring" cx="1020" cy="842" r="14"/>
  <circle class="startend" cx="1020" cy="842" r="8"/>

  <path class="line" d="M170 152 L170 175"/>
  <path class="line" d="M270 204 L350 204"/>
  <path class="line" d="M550 204 L650 204"/>
  <path class="line" d="M1020 323 L1020 342 L450 342 L450 323"/>
  <path class="line" d="M550 294 L650 294"/>
  <path class="line" d="M170 413 L170 438 L450 438 L450 455"/>
  <path class="line" d="M270 384 L350 384"/>
  <path class="line" d="M550 384 L650 384"/>
  <path class="line" d="M170 531 L170 552 L450 552 L450 570"/>
  <path class="line" d="M270 493 L350 493"/>
  <path class="line" d="M450 531 L450 570"/>
  <path class="line" d="M535 625 L650 625"/>
  <text x="590" y="615" class="small">Yes</text>
  <path class="line" d="M450 680 L450 720"/>
  <text x="424" y="704" class="small">No</text>
  <path class="line" d="M1020 778 L1020 800 L550 800 L550 839"/>
  <path class="dash" d="M650 204 L585 204 L585 820 L550 820"/>
  <path class="dash" d="M650 294 L605 294 L605 832 L550 832"/>
  <path class="dash" d="M650 384 L625 384 L625 844 L550 844"/>
  <path class="dash" d="M730 661 L730 856 L550 856"/>
  <path class="line" d="M450 868 L450 894 L1020 894 L1020 856"/>
</svg>
