<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="940" viewBox="0 0 1320 940" role="img" aria-labelledby="title desc">
  <title id="title">Figure 4.1: System Architecture Diagram</title>
  <desc id="desc">System architecture diagram for a QR Attendance System showing actors, browser client, Apache PHP application layer, shared includes, and MySQL database tables.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .page { fill: #f8fafc; }
      .title { fill: #0f172a; font: 700 24px Arial, sans-serif; text-anchor: middle; }
      .subtitle { fill: #475569; font: 13px Arial, sans-serif; text-anchor: middle; }
      .actor { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 8; }
      .client { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; rx: 8; }
      .server { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; rx: 8; }
      .dbbox { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2.5; rx: 8; }
      .module { fill: #ffffff; stroke: #64748b; stroke-width: 1.7; rx: 7; }
      .include { fill: #faf5ff; stroke: #9333ea; stroke-width: 1.7; rx: 7; }
      .table { fill: #ffffff; stroke: #15803d; stroke-width: 1.7; rx: 7; }
      .label { fill: #0f172a; font: 700 16px Arial, sans-serif; text-anchor: middle; }
      .text { fill: #111827; font: 14px Arial, sans-serif; text-anchor: middle; }
      .small { fill: #334155; font: 12px Arial, sans-serif; text-anchor: middle; }
      .line { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="page" width="1320" height="940"/>
  <text class="title" x="660" y="38">Figure 4.1: System Architecture Diagram</text>
  <text class="subtitle" x="660" y="60">QR Attendance System</text>

  <rect class="actor" x="50" y="145" width="155" height="70"/>
  <text class="label" x="127.5" y="174">Attendee</text>
  <text class="small" x="127.5" y="195">Registers, joins, scans</text>

  <rect class="actor" x="50" y="690" width="155" height="70"/>
  <text class="label" x="127.5" y="719">Organizer</text>
  <text class="small" x="127.5" y="740">Creates events, reports</text>

  <rect class="client" x="250" y="110" width="255" height="690"/>
  <text class="label" x="377.5" y="142">Client Device</text>
  <text class="small" x="377.5" y="162">Web Browser</text>

  <rect class="module" x="285" y="215" width="185" height="86"/>
  <text class="text" x="377.5" y="244">User Interface</text>
  <text class="small" x="377.5" y="265">HTML, CSS, JavaScript</text>
  <text class="small" x="377.5" y="283">Responsive pages</text>

  <rect class="module" x="285" y="500" width="185" height="86"/>
  <text class="text" x="377.5" y="529">QR Scanner</text>
  <text class="small" x="377.5" y="550">Camera input</text>
  <text class="small" x="377.5" y="568">QR scan payload</text>

  <rect class="server" x="555" y="88" width="445" height="760"/>
  <text class="label" x="777.5" y="120">Web Server</text>
  <text class="small" x="777.5" y="140">Apache / XAMPP with PHP application files</text>

  <rect class="module" x="585" y="175" width="175" height="72"/>
  <text class="text" x="672.5" y="202">Authentication</text>
  <text class="small" x="672.5" y="223">login.php, auth.php</text>

  <rect class="module" x="795" y="175" width="175" height="72"/>
  <text class="text" x="882.5" y="202">Dashboard</text>
  <text class="small" x="882.5" y="223">dashboard.php</text>

  <rect class="module" x="585" y="285" width="175" height="82"/>
  <text class="text" x="672.5" y="310">Event Management</text>
  <text class="small" x="672.5" y="331">events.php, event.php</text>
  <text class="small" x="672.5" y="349">create-event.php</text>

  <rect class="module" x="795" y="285" width="175" height="82"/>
  <text class="text" x="882.5" y="315">QR Generation</text>
  <text class="small" x="882.5" y="338">generate-qr.php</text>

  <rect class="module" x="585" y="405" width="175" height="94"/>
  <text class="text" x="672.5" y="431">Attendance</text>
  <text class="small" x="672.5" y="452">scan.php</text>
  <text class="small" x="672.5" y="470">save-attendance.php</text>
  <text class="small" x="672.5" y="488">attendance-submit.php</text>

  <rect class="module" x="795" y="405" width="175" height="94"/>
  <text class="text" x="882.5" y="431">Reporting</text>
  <text class="small" x="882.5" y="452">report.php</text>
  <text class="small" x="882.5" y="470">attendance.php</text>
  <text class="small" x="882.5" y="488">my-attendance.php</text>

  <rect class="module" x="585" y="535" width="385" height="76"/>
  <text class="text" x="777.5" y="563">Branding and Settings</text>
  <text class="small" x="777.5" y="584">organization-branding.php, system-settings.php</text>

  <rect class="include" x="585" y="680" width="115" height="70"/>
  <text class="text" x="642.5" y="706">DB</text>
  <text class="small" x="642.5" y="727">includes/db.php</text>

  <rect class="include" x="715" y="680" width="115" height="70"/>
  <text class="text" x="772.5" y="706">Utilities</text>
  <text class="small" x="772.5" y="727">includes/app.php</text>

  <rect class="include" x="845" y="680" width="115" height="70"/>
  <text class="text" x="902.5" y="706">Styles</text>
  <text class="small" x="902.5" y="727">style.css</text>

  <rect class="dbbox" x="1050" y="160" width="220" height="600"/>
  <text class="label" x="1160" y="192">MySQL Database</text>

  <rect class="table" x="1080" y="245" width="160" height="55"/>
  <text class="text" x="1160" y="278">users</text>

  <rect class="table" x="1080" y="330" width="160" height="55"/>
  <text class="text" x="1160" y="363">events</text>

  <rect class="table" x="1080" y="415" width="160" height="55"/>
  <text class="text" x="1160" y="448">participants</text>

  <rect class="table" x="1080" y="500" width="160" height="55"/>
  <text class="text" x="1160" y="533">attendance</text>

  <rect class="table" x="1080" y="585" width="160" height="64"/>
  <text class="text" x="1160" y="611">organizations</text>
  <text class="small" x="1160" y="632">and venues</text>

  <path class="line" d="M205 180 L285 245"/>
  <text class="small" x="245" y="198">register/login</text>
  <path class="line" d="M205 725 L285 275"/>
  <text class="small" x="238" y="680">manage</text>
  <path class="line" d="M205 180 L285 540"/>
  <text class="small" x="240" y="365">scan QR</text>

  <path class="line" d="M470 258 L585 211"/>
  <path class="line" d="M470 258 L795 211"/>
  <path class="line" d="M470 258 L585 326"/>
  <path class="line" d="M470 258 L795 326"/>
  <path class="line" d="M470 258 L795 452"/>
  <path class="line" d="M470 258 L585 573"/>
  <path class="line" d="M470 543 L585 452"/>

  <path class="dash" d="M672 247 L642 680"/>
  <path class="dash" d="M882 247 L642 680"/>
  <path class="dash" d="M672 367 L642 680"/>
  <path class="dash" d="M882 367 L642 680"/>
  <path class="dash" d="M672 499 L642 680"/>
  <path class="dash" d="M882 499 L642 680"/>
  <path class="dash" d="M777 611 L642 680"/>

  <path class="dash" d="M672 247 L772 680"/>
  <path class="dash" d="M882 499 L772 680"/>
